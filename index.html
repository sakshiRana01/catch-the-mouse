<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the mouse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ea66ba75, #ed2c86);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-intro {
            width: min(90%, 600px);
            background-color: white;
            padding: 45px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .game-title {
            font-size: 42px;
            color: #ed2c86;
            margin-bottom: 20px;
        }

        .game-instructions {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .game-instructions label {
            display: block;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        #start,
        .restart-game {
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            background-color: #ed2c86;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #start:hover {
            background-color: #a1014c;
            transform: translateY(-2px);
        }

        #start:active {
            transform: translateY(0);
        }

        #mouse {
            position: absolute;
        }

        .attempts-left {
            position: absolute;
            top: 12px;
            right: 12px;
        }

        .attempts-left,
        .success-click {
            position: fixed;
            right: 20px;
            padding: 10px 18px;
            border-radius: 10px;
            background-color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .attempts-left {
            top: 20px;
        }

        .success-click {
            top: 75px;
        }

        .game-card {
            display: none;
        }

        .game {
            display: none;
        }
    </style>
</head>

<body id="body">
    <main class="container">
        <div class="game-intro">
            <h1 class="game-title">Catch the mouse</h1>
            <p class="game-instructions"><label for="mouse">How to Play:</label>you have 1 round and
                5 attempts to catch
                the mouse if you catch the mouse then you won otherwise better luck next time</p>
            <button id="start">Start The game</button>
        </div>
        <div class="game">
            <div class="game-start">
                <img src="./mouse-img.png" alt="Mouse"
                    style="width: 100px; height: 100px; display: block; margin: 20px auto;" id="mouse" class="mouse">
            </div>
            <div class="attempts-left">5 left
            </div>
            <div class="success-click"></div>
        </div>
        <div class="game-card game-intro">
            <p class="game-status game-instructions"></p>
            <button class="restart-game">Restart the Games</button>
        </div>

    </main>
</body>
<script>
    const startTheGame = document.querySelector("#start");
    let attempts = 5, success = 0, mouseMoving;
    const mouse = document.querySelector('#mouse');

    const mouseMovingInterval = function () {
        const mouse = document.querySelector('#mouse');
        const randomX = Math.floor(Math.random() * (window.innerWidth - 100));
        const randomY = Math.floor(Math.random() * (window.innerHeight - 100));
        mouse.style.left = randomX + 'px';
        mouse.style.top = randomY + 'px';
    }

    const sucessClickUpdate = function (num) {
        document.querySelector(".success-click").innerHTML = `<p>success click:${num} </p>`

    };
    function attemptClickUpdate(num) {
        const attemptsLeft = document.querySelector('.attempts-left');
        attemptsLeft.innerHTML = `<p>${num} left</p>`;
    }

    function reStartTheGame(status) {

        const message = document.querySelector('.game-status');
        const gameCard = document.querySelector('.game-card');
        const game = document.querySelector('.game');
        gameCard.style.display = "block"
        game.style.display = 'none'
        clearInterval(mouseMoving)
        if (status == "won") {

            message.innerHTML = "KUDOS! you won the game"
        }
        else {
            message.innerHTML = "Better Luck Next time!"
        }

    }

    document.querySelector('.restart-game').addEventListener('click', function (e) {
        e.stopPropagation();
        attempts = 5, success = 0;
        attemptClickUpdate(attempts);
        sucessClickUpdate(success);
        clearInterval(mouseMoving)
        const gameIntro = document.querySelector('.game-intro');
        const game = document.querySelector('.game');
        gameIntro.style.display = 'block';
        game.style.display = 'none'
        const gameCard = document.querySelector('.game-card');
        gameCard.style.display = "none"
    })
  mouse.addEventListener('click', function (e) {
            e.stopPropagation()
            success++;
            sucessClickUpdate(success)
            if (success == 5) {
                reStartTheGame("won")
            }
          

        })
        console.log(attempts);
        
        window.addEventListener('click', function (e) {
           if (e.target.className !== "mouse") {
                    console.log("in the if")
                    attempts--;
                    attemptClickUpdate(attempts)
                }
            if (attempts == 0) {
                reStartTheGame("lost")
            }
           
        })
    startTheGame.addEventListener('click', function (e) {
        e.stopPropagation();
        const gameIntro = document.querySelector('.game-intro');
        const game = document.querySelector('.game');
        gameIntro.style.display = 'none';
        game.style.display = 'block'
        mouseMoving = setInterval(mouseMovingInterval, 700)
      
    })

</script>

</html>
